#
# Config for the Eyelash Peripherals Corne (eyelash_corne shield).
#
# This file applies to both halves. Per-half hardware settings come from the
# shield itself (boards/shields/eyelash_corne/eyelash_corne_{left,right}.conf
# in the a741725193/zmk-new_corne module).
#

# --- General -----------------------------------------------------------------

# Go to sleep after one hour of inactivity.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y

# Increase the keyboard's wireless range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Debounce. Lower values reduce latency but demand better switch quality.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

# --- ZMK Studio --------------------------------------------------------------

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- Encoder (thumb scroller on the left half) -------------------------------

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- Pointing / mouse --------------------------------------------------------

# The keymap uses &mmv / &mkp on the lower/symbol/Fn layers.
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- RGB underglow -----------------------------------------------------------

CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# --- Backlight ---------------------------------------------------------------

CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100

# --- HID ---------------------------------------------------------------------

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# Some OSes mishandle consumer keycodes; uncomment if C_* codes misbehave.
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
# The Mission Control / Spotlight stick keys are consumer keycodes (C_AC_*).
CONFIG_ZMK_HID_CONSUMER_REPORT_SIZE=6

# --- Power -------------------------------------------------------------------

# Hold Q+S+Z for 2 seconds to soft off (see the `softoff` combo).
CONFIG_ZMK_PM_SOFT_OFF=y

# --- Logging -----------------------------------------------------------------

# Uncomment for USB logging; it significantly increases power use.
# CONFIG_ZMK_USB_LOGGING=y
