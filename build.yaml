---
# Builds for the Eyelash Peripherals Corne.
#
# This is NOT a standard foostan corne - it uses the `eyelash_corne_left` /
# `eyelash_corne_right` shields provided by the a741725193/zmk-new_corne
# module (see config/west.yml). Building `corne_left` / `corne_right` here
# would produce firmware that does not work on this keyboard.
#
# Flash the _left firmware to the left half and the _right firmware to the
# right half. `settings_reset` is only needed when re-pairing the halves.
include:
  - board: nice_nano_v2
    shield: eyelash_corne_right nice_view
    artifact-name: eyelash_corne_right
  - board: nice_nano_v2
    shield: eyelash_corne_left nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_studio_left
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
